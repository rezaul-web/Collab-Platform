# ═══════════════════════════════════════════════════════════════════════
# API Gateway — Spring Cloud Gateway Configuration
# ═══════════════════════════════════════════════════════════════════════

server:
  port: 8000

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive   # required for Spring Cloud Gateway

  cloud:
    gateway:
      # ── Global CORS ─────────────────────────────────────────────────
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      # ── Route Definitions ───────────────────────────────────────────
      routes:

        # Auth Service (port 8081)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # Chat Service — REST & GraphQL (port 8082)
        - id: chat-service-graphql
          uri: http://localhost:8082
          predicates:
            - Path=/graphql,/graphiql

        # Chat Service — WebSocket (port 8082)
        - id: chat-service-ws
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/**

        # Signalling Service — REST health (port 8083)
        - id: signalling-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/signalling/**

        # Media Service (port 8084)
        - id: media-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/media/**

# ── Actuator ──────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

# ── Logging ───────────────────────────────────────────────────────────
logging:
  level:
    com.example.collab.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
