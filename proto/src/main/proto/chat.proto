syntax = "proto3";

package com.example.collab.proto.chat;

option java_package = "com.example.collab.proto.chat";
option java_multiple_files = true;

message SendMessageRequest {
  string room_id = 1;
  string sender_id = 2;
  string content = 3;
}

message MessageResponse {
  string message_id = 1;
  string room_id = 2;
  string sender_id = 3;
  string content = 4;
  string sent_at = 5;
}

message GetRoomMessagesRequest {
  string room_id = 1;
  int32 page = 2;
  int32 size = 3;
}

message RoomMessagesResponse {
  repeated MessageResponse messages = 1;
  int64 total_count = 2;
}

service ChatService {
  rpc SendMessage(SendMessageRequest) returns (MessageResponse);
  rpc GetRoomMessages(GetRoomMessagesRequest) returns (RoomMessagesResponse);
}
