syntax = "proto3";

package com.example.collab.proto.user;

option java_package = "com.example.collab.proto.user";
option java_multiple_files = true;

message GetUserRequest {
  string user_id = 1;
}

message UserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  string role = 5;
}

message TokenRequest {
  string token = 1;
}

message TokenResponse {
  bool valid = 1;
  string username = 2;
  string role = 3;
}

service UserService {
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc ValidateToken(TokenRequest) returns (TokenResponse);
}
