server:
  port: 8082

spring:
  application:
    name: chat-service

  # ── PostgreSQL ──────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/collab_chat}
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: Rezaul@2004

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── GraphQL ─────────────────────────────────────────────────────────
  graphql:
    graphiql:
      enabled: true
    schema:
      locations: classpath:graphql/
    websocket:
      path: /graphql

grpc:
  client:
    auth-service:
      address: ${AUTH_SERVICE_GRPC:static://localhost:9091}
      negotiation-type: plaintext

app:
  jwt:
    secret: Y29sbGFiLXBsYXRmb3JtLXN1cGVyLXNlY3JldC1rZXktMTIzNDU2Nzg=
    expiration-ms: 86400000

logging:
  level:
    com.example.collab.chat: DEBUG
