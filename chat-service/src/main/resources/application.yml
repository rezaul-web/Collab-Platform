server:
  port: 8082
spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  graphql:
    graphiql:
      enabled: true
    schema:
      locations: classpath:graphql/
    websocket:
      path: /graphql

grpc:
  client:
    auth-service:
      address: static://localhost:9091
      negotiation-type: plaintext

app:
  jwt:
    secret: Y29sbGFiLXBsYXRmb3JtLXN1cGVyLXNlY3JldC1rZXktMTIzNDU2Nzg=
    expiration-ms: 86400000

logging:
  level:
    com.example.collab.chat: DEBUG
